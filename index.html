<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>લગ્ન બાયોડેટા</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#fff8ef;color:#3b2430;font-family:Arial,sans-serif}
h1{text-align:center;color:#741238}
.grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:650px;margin:auto}
.card{background:#fff;border:1px solid #e8d6df;border-radius:16px;padding:14px;overflow:hidden}
.card img{width:100%;height:auto;display:block;object-fit:contain;border-radius:10px}
h2{color:#741238;margin:12px 0}
p{margin:7px 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>લગ્ન બાયોડેટા</h1>
<div class="grid" id="profiles"></div>

<script>
const biodata=[
 {name:"નેના ભોરા",age:"23 વર્ષ",height:"5 ફૂટ 2 ઇંચ",education:"B.Sc.",job:"લેબ ટેક્નિશિયન",city:"વડોદરા, ગુજરાત",photo:"biodata1.jpg"},
 {name:"નિશા દેસાઈ",age:"24 વર્ષ",height:"5 ફૂટ 3 ઇંચ",education:"B.A.",job:"ખાનગી ઓફિસમાં નોકરી",city:"વડોદરા",photo:"biodata2.jpg"},
 {name:"કાવ્યા સોલંકી",age:"22 વર્ષ",height:"5 ફૂટ 1 ઇંચ",education:"ધોરણ 10 પાસ",job:"બ્યુટી પાર્લરમાં સહાયક",city:"જામનગર",photo:"biodata3.jpg"},
 {name:"પ્રિયા દાસ",age:"25 વર્ષ",height:"5 ફૂટ 1 ઇંચ",education:"B.Com.",job:"ટી-અસિસ્ટન્ટ",city:"દ્વારકા",photo:"biodata4.jpg"},
 {name:"હેતલ રાઠોડ",age:"23 વર્ષ",height:"5 ફૂટ 3 ઇંચ",education:"B.A.",job:"ખાનગી ઓફિસમાં નોકરી",city:"રાજકોટ",photo:"biodata5.jpg"},
 {name:"કાવ્યા પટેલ",age:"24 વર્ષ",height:"5 ફૂટ 2 ઇંચ",education:"B.Com.",job:"પ્રાઇવેટ કંપનીમાં નોકરી",city:"અમદાવાદ",photo:"biodata6.jpg"},
 {name:"નંદિની ચૌહાણ",age:"25 વર્ષ",height:"5 ફૂટ 2 ઇંચ",education:"B.A.",job:"પ્રાઇવેટ નોકરી",city:"વડોદરા",photo:"biodata7.jpg"},
 {name:"કાવ્યા રાઠોડ",age:"21 વર્ષ",height:"5 ફૂટ 3 ઇંચ",education:"B.A. (ચાલુ)",job:"અભ્યાસ સાથે પાર્ટ-ટાઇમ",city:"રાજકોટ",photo:"biodata8.jpg"},
 {name:"રીયા પટેલ",age:"22 વર્ષ",height:"5 ફૂટ 4 ઇંચ",education:"B.Com.",job:"પ્રાઇવેટ નોકરી",city:"રાજકોટ",photo:"biodata9.jpg"},
 {name:"રીમા પટેલ",age:"23 વર્ષ",height:"5 ફૂટ 3 ઇંચ",education:"ધોરણ 12 પાસ",job:"ખાનગી નોકરી",city:"અમદાવાદ",photo:"biodata10.jpg"}
];

document.getElementById("profiles").innerHTML=biodata.map((p,i)=>`
 <article class="card">
   <img src="${p.photo}" alt="${p.name}નો બાયોડેટા"
        onerror="this.style.display='none'">
   <h2>${p.name}</h2>
   <p><b>બાયોડેટા ID:</b> CMB-${String(i+1).padStart(3,"0")}</p>
   <p><b>ઉંમર:</b> ${p.age}</p>
   <p><b>ઊંચાઈ:</b> ${p.height}</p>
   <p><b>શિક્ષણ:</b> ${p.education}</p>
   <p><b>નોકરી / વ્યવસાય:</b> ${p.job}</p>
   <p><b>શહેર:</b> ${p.city}</p>
 </article>
`).join("");
</script>
</body>
</html>
